# GitHub Actions Workflow for Azure Bootstrap Library
# This workflow builds, tests, and publishes the library to PyPI
#
# Publishing Strategy:
# - main branch → Stable releases (e.g., 1.0.0)
# - develop branch → Development releases (e.g., 1.0.0.dev20250121123456)
# - Tags (v*) → Tagged stable releases

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

env:
  PYTHON_VERSION: "3.11"
  PACKAGE_NAME: "azure-bootstrap"

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    outputs:
      package-version: ${{ steps.set-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install build twine

      - name: Install package with test + all extras
        run: |
          pip install -e ".[test,all]"

      - name: Run tests with coverage
        run: |
          pytest test/ --verbose --cov=azure_bootstrap --cov-report=xml --cov-report=html --cov-report=term --junitxml=test-results.xml -m "not integration"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Set package version
        id: set-version
        run: |
          if [ "$GITHUB_REF" == "refs/heads/develop" ]; then
            # Get base version from pyproject.toml
            BASE_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            # Create dev version with timestamp
            DEV_VERSION="${BASE_VERSION}.dev$(date +%Y%m%d%H%M%S)"
            echo "Building development version: ${DEV_VERSION}"
            echo "version=${DEV_VERSION}" >> $GITHUB_OUTPUT

            # Update version in pyproject.toml for build
            sed -i "s/version = \".*\"/version = \"${DEV_VERSION}\"/" pyproject.toml

            # Update version in __init__.py for build
            sed -i "s/__version__ = \".*\"/__version__ = \"${DEV_VERSION}\"/" azure_bootstrap/__init__.py

            echo "Updated version to ${DEV_VERSION} for development build"
          else
            BASE_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
            echo "Building stable version: ${BASE_VERSION}"
            echo "version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Validate distribution packages
        run: |
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  test-integration:
    name: Integration Tests (SQLite / mongomock / Azurite)
    runs-on: ubuntu-latest

    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
        options: >-
          --entrypoint azurite
          azurite --skipApiVersionCheck -l /data
          --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0

    env:
      AZURITE_BLOB_CONNECTION_STRING: >-
        DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package with test + all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,all]"

      - name: Run integration tests
        run: |
          pytest test/integration/ -m integration --verbose --no-cov

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only tag on push to main (not PRs, develop, or existing tags)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write  # Required to push tags

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Create version tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG="v${VERSION}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping (version was not bumped)."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Created and pushed tag ${TAG}."

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only publish on push to main or tags (not on PRs or develop)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    environment: pypi
    permissions:
      id-token: write  # Required for Trusted Publishers

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        # No credentials needed — uses OIDC Trusted Publisher
        with:
          # A release pushes main + a tag together; both trigger this job. The
          # first upload wins, so make the loser a no-op instead of a 400 failure.
          skip-existing: true

  publish-dev:
    name: Publish Dev to PyPI
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only publish dev builds on push to develop
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0

  validate-installation:
    name: Validate Installation
    runs-on: ubuntu-latest
    needs: publish
    if: success()

    steps:
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Wait for PyPI indexing
        run: |
          echo "Waiting 15 seconds for PyPI indexing..."
          sleep 15

      - name: Install package from PyPI
        run: |
          pip install ${{ env.PACKAGE_NAME }}

      - name: Verify package imports
        run: |
          python -c "from azure_bootstrap import initialize_application, get_bootstrap_logger; print('Import successful!')"

      - name: Check package version
        run: |
          python -c "import azure_bootstrap; print(f'Version: {azure_bootstrap.__version__}')"

      - name: Installation instructions
        run: |
          echo "=========================================="
          echo "Package validation complete!"
          echo "=========================================="
          echo ""
          echo "Install with:"
          echo "  pip install ${{ env.PACKAGE_NAME }}"
          echo ""
          echo "Or add to requirements.txt:"
          echo "  ${{ env.PACKAGE_NAME }}"
          echo ""
